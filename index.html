<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadê o 01?</title>
<style>
  /* VT323 (SIL OFL, ver OFL-VT323.txt), só latim */
  @font-face { font-family: VT323; src: url(vt323.woff2) format('woff2'); font-display: swap; }
  body { background: #000; color: #ffff55; font: 22px/1.3 VT323, "Courier New", monospace; max-width: 760px; margin: .8em auto; padding: 0 1em; }
  /* moldura em relevo e efeito de tubo: linhas de varredura e cantos escuros, por cima da arte */
  #screen { position: relative; border: 4px solid; border-color: #fff #555 #555 #fff; border-bottom: 0; }
  #screen::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(rgba(0, 0, 0, .2) 0 1px, transparent 1px 3px), radial-gradient(ellipse, transparent 60%, rgba(0, 0, 0, .4)); }
  #art { display: block; width: 100%; aspect-ratio: 16 / 9; background: #0000aa; shape-rendering: crispEdges; }
  /* balão de fala sobre a cena; fica abaixo da barra de prazo e acima das linhas de varredura */
  #screen { container-type: inline-size; }
  #balloon { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
  #say { position: absolute; top: 10%; bottom: 38%; max-width: 70%; display: flex; flex-direction: column; justify-content: flex-end; }
  #say div { padding: .2em .45em; color: #000; background: #fff; border: 2px solid #000; font-size: max(17px, 3.6cqw); line-height: 1.05; pointer-events: auto; cursor: pointer; }
  #tail { position: absolute; bottom: calc(38% - 10px); width: 14px; height: 12px; margin-left: -7px; background: #000; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  #tail::after { content: ''; position: absolute; left: 3px; top: 0; width: 8px; height: 8px; background: #fff; clip-path: polygon(0 0, 100% 0, 50% 100%); }
  /* provas e eventos: faixa que pisca ao entrar */
  .hl { padding: .3em 1em; color: #000; background: #ffff55; border: 2px solid #000; animation: blink .25s steps(1) 4; }
  .hl.bad { color: #fff; background: #aa0000; }
  @media (prefers-reduced-motion: reduce) { .hl { animation: none; } }
  #text { white-space: pre-wrap; border: 6px double #aaaaaa; padding: .8em 1em; background: #0000aa; min-height: 6em; cursor: pointer; }
  #opts { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; margin-top: .4em; }
  @media (max-width: 600px) { body { font-size: 20px; } #opts { grid-template-columns: 1fr; } #say { max-width: 96%; } }
  /* alvo de toque de pelo menos 44px */
  #opts button, #opts a { display: block; box-sizing: border-box; width: 100%; min-height: 44px; padding: .5em .6em; text-align: left; font: inherit; font-size: 21px; line-height: 1.1; color: #000; background: #55ffff; border: 0; cursor: pointer; text-decoration: none;
    box-shadow: inset 3px 3px 0 #fff, inset -3px -3px 0 #00aaaa; }
  #opts button:hover, #opts button:focus, #opts a:hover, #opts a:focus { background: #fff; }
  #opts button:active, #opts a:active { box-shadow: inset 3px 3px 0 #00aaaa, inset -3px -3px 0 #fff; }
  #opts button:disabled { opacity: .4; }
  .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(200px); } }
  .rain { animation: fall .5s linear infinite; }
  @keyframes fall { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blink { animation: blink .6s steps(1) infinite; }
  .blink2 { animation: blink .6s steps(1) infinite -.3s; }
  @keyframes blink { 50% { opacity: 0; } }
  .bob { animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(1.5px); } }
  .run { animation: run 3s linear forwards; }
  @keyframes run { from { transform: translateX(170px); } to { transform: translateX(-30px); } }
  /* longe das opções e sem atalho numérico, para não abandonar sem querer */
  #quit { display: block; min-height: 44px; margin: 2em 0 0 auto; padding: .5em .8em; font: inherit; font-size: 20px; color: #ff5555; background: none; border: 2px solid #ff5555; cursor: pointer; }
  #quit[hidden] { display: none; }
  #snd { position: fixed; top: .2em; right: .2em; width: 44px; height: 44px; font-size: 20px; background: none; border: 0; cursor: pointer; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .away { animation: away 3s ease-in forwards; }
  @keyframes away { from { transform: translate(0, 0); } to { transform: translate(140px, -70px) scale(.3); } }
</style>
</head>
<body>
<button id="snd" title="Som (tecla S)" aria-label="Ligar ou desligar o som">🔊</button>
<div id="screen"><svg id="art" viewBox="0 0 160 90" role="img" aria-label="Carregando"></svg>
  <div id="balloon" hidden aria-hidden="true"><div id="say"><div></div></div><div id="tail"></div></div></div>
<div id="news" aria-hidden="true"></div>
<div id="text" aria-hidden="true">Carregando…</div>
<div id="sr" class="sr" aria-live="polite"></div>
<div id="opts"></div>
<button id="quit" hidden>✖ Abandonar caso e voltar ao menu</button>
<script type="module">
// --- arte: tudo desenhado aqui, paleta de 16 cores estilo EGA ---
const K = { blk: '#000', blu: '#0000aa', grn: '#00aa00', cya: '#00aaaa', red: '#aa0000', mag: '#aa00aa', brn: '#aa5500', gry: '#aaaaaa',
  dgr: '#555555', lbl: '#5555ff', lgn: '#55ff55', lcy: '#55ffff', lrd: '#ff5555', lmg: '#ff55ff', yel: '#ffff55', wht: '#fff' };
const R = (x, y, w, h, c, a = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" ${a}/>`;
const P = (pts, c, a = '') => `<polygon points="${pts}" fill="${c}" ${a}/>`;
const C = (x, y, r, c, a = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${a}/>`;
const D = (d, c, a = '') => `<path d="${d}" fill="${c}" ${a}/>`;
const T = (x, y, s, c, txt, a = '') => `<text x="${x}" y="${y}" font-size="${s}" fill="${c}" font-family="VT323, monospace" ${a}>${txt}</text>`;
// sprites: grade de texto, 1 letra = 1 pixel de 2x2 unidades; '.' é transparente
const PAL = { k: K.blk, b: K.blu, g: K.grn, c: K.cya, r: K.red, m: K.mag, n: K.brn, a: K.gry, d: K.dgr, B: K.lbl,
  G: K.lgn, C: K.lcy, R: K.lrd, M: K.lmg, y: K.yel, w: K.wht, p: '#ffaa77' };
const spr = (rows, x, y, a = '', s = 2) => {
  let out = '';
  rows.forEach((row, j) => {
    for (let i = 0; i < row.length;) {
      let n = 1;
      while (row[i + n] === row[i]) n++;
      if (row[i] !== '.') out += R(i * s, j * s, n * s, s, PAL[row[i]]);
      i += n;
    }
  });
  return `<g transform="translate(${x} ${y})" ${a}>${out}</g>`;
};
const at = (rows, x, bottom, a, s = 2) => spr(rows, x, bottom - rows.length * s, a, s); // apoia o sprite no chão
const anim = (cls, s) => `<g class="${cls}">${s}</g>`; // animação CSS fora do transform do sprite

const CLOUD = ['..www....', '.wwwwww..', 'wwwwwwwww'];
const IGUANA = ['.....GGk', 'GGGGGGG.', '.g..g...'];
// mandado: papel com selo vermelho do STF
const WARRANT = ['wwwwwwww', 'wkkkkkkw', 'wwwwwwww', 'wkkkkkww', 'wwwwwwww', 'wkkkwRRw', 'wwwwwRRw', 'wwwwwwww'];
const JET = ['ww...........', 'www..........', 'wwwwwwwwwwww.', 'wCwCwCwCwwwwC', '.wwwwwwwwwww.', '.....ww......', '....ww.......'];

// personagens 16x26 em pixel de 1 unidade (mesmo tamanho na tela dos antigos 8x13 em pixel 2)
// H cabelo/chapéu, S camisa, L calça, p pele; minúsculas s/l = sombra do lado direito
const PERSON = ['....HHHHHHHH....', '...HHHHHHHHHH...', '..HHHHHHHHHHHH..', '..HHpppppppppH..', '..Hppppppppppp..',
  '..ppwkppppwkpp..', '..pppppppppppp..', '...pppppppppp...', '...pppprrpppp...', '....pppppppp....', '.....pppppp.....', '......pppp......',
  '..SSSSSwwSSSSS..', '.SSSSSSSSSSSSss.', 'SSSSSSSSSSSSSsss', 'SS.SSSSSSSSSs.ss', 'SS.SSSSSSSSSs.ss', 'pp.SSSSSSSSSs.pp',
  'pp.kkkkyykkkk.pp', '...LLLLLLLLLl...', '...LLLL..LLLl...', '...LLLL..LLLl...', '...LLLL..LLLl...', '...LLLL..LLLl...',
  '...kkkk..kkkk...', '..kkkkk..kkkkk..'];
// cabeças alternativas (5 primeiras linhas)
const TOP = {
  hat: ['....HHHHHHHH....', '....HHHHHHHH....', '....kkkkkkkk....', 'HHHHHHHHHHHHHHHH', '..pppppppppppp..'],
  cap: ['....HHHHHHH.....', '...HHHHHHHHH....', '...HHHHHHHHHHHHH', '..pppppppppppp..', '..pppppppppppp..'],
  chef: ['...HHHHHHHHHH...', '..HHHHHHHHHHHH..', '...HHHHHHHHHH...', '...aaaaaaaaaa...', '..pppppppppppp..'],
  bald: ['................', '....pppppppp....', '...pppppppppp...', '..HppppppppppH..', '..HppppppppppH..'],
  ears: ['HHH..........HHH', 'HHHH........HHHH', '..HHHHHHHHHHHH..', '..HHHHHHHHHHHH..', '..pppppppppppp..'],
  plume: ['..HHHHHHHHHHH...', '...HHHHHHHHHHH..', '...aaaaaaaaaa...', '..aaaaaaaaaaaa..', '..appppppppppa..'],
};
const DARK = { w: 'a', a: 'd', d: 'k', k: 'k', y: 'n', C: 'c', G: 'g', R: 'r', M: 'm', B: 'b', b: 'k', n: 'r', r: 'k', g: 'k', c: 'b', m: 'k' };
const person = (h, s, l, skin = 'p', top) => [...(TOP[top] || PERSON.slice(0, 5)), ...PERSON.slice(5)]
  .map(r => r.replace(/H/g, h).replace(/s/g, DARK[s]).replace(/S/g, s).replace(/l/g, DARK[l]).replace(/L/g, l).replace(/p/g, skin));
// troca trechos de linhas: {linha: [coluna, texto]}
const patch = (rows, ps) => rows.map((r, j) => (ps[j] || []).reduce((r, [c, t]) => r.slice(0, c) + t + r.slice(c + t.length), r));
// mesma ordem de WITNESSES em src/lib.rs
const WITNESS = [person('y', 'w', 'd'), person('k', 'w', 'k'), person('n', 'd', 'd', 'n'), person('n', 'M', 'b'),
  person('k', 'a', 'd', 'n'), person('M', 'C', 'b'), person('b', 'w', 'b'), person('a', 'G', 'n', 'n'),
  // locais, 3 por cidade, na ordem de CITIES
  person('k', 'd', 'd'), person('k', 'd', 'd', 'n', 'bald'), person('y', 'y', 'b', 'p', 'hat'), // Brasília
  person('n', 'b', 'b'), person('w', 'w', 'b', 'p', 'chef'), person('r', 'r', 'k', 'n', 'cap'), // São Paulo
  person('y', 'y', 'w', 'n', 'hat'), person('a', 'w', 'd', 'p', 'bald'), person('y', 'C', 'b', 'n'), // Rio
  person('k', 'R', 'k'), person('w', 'w', 'k', 'p', 'chef'), person('k', 'g', 'd', 'p', 'cap'), // Buenos Aires
  person('w', 'w', 'n', 'n', 'hat'), person('k', 'C', 'n', 'n', 'cap'), person('b', 'b', 'b', 'n', 'cap'), // Guayaquil
  person('y', 'R', 'R', 'p', 'cap'), person('k', 'w', 'k', 'n'), person('n', 'G', 'b', 'p', 'cap'), // Miami
  person('k', 'R', 'y', 'k', 'ears'), person('M', 'M', 'd'), person('n', 'M', 'b'), // Orlando
  person('a', 'k', 'k'), person('b', 'b', 'b', 'n', 'cap'), person('y', 'w', 'd'), // Washington
  person('a', 'w', 'n', 'p', 'hat'), person('k', 'g', 'd', 'n'), person('a', 'n', 'n', 'p', 'chef'), // Jerusalém
  person('k', 'b', 'd'), person('R', 'y', 'n', 'p', 'plume'), person('R', 'y', 'b', 'p', 'plume'), // Roma
  person('k', 'y', 'd', 'p', 'cap'), person('k', 'd', 'k'), person('w', 'w', 'd', 'p', 'chef'), // Lisboa
  person('a', 'd', 'd', 'p', 'bald'), person('n', 'G', 'n', 'p', 'hat'), person('a', 'm', 'n')]; // Funchal
// acessório na mão direita de cada testemunha, mesma ordem de WITNESS
const PROP = {
  taxi: ['kyk', 'yyy'], tray: ['wyw', 'aaa'], folder: ['yy', 'yy'], choc: ['MMM', 'nnn'], sign: ['RRR', 'RwR', '.a.', '.a.', '.a.'],
  phone: ['k', 'C', 'k'], roll: ['kkk', 'kkk', 'kkk', 'a.a'], bino: ['k.k', 'kkk'], case: ['.k.', 'nnn', 'nnn'], radio: ['a', 'k', 'k'],
  corn: ['g', 'y', 'y', 'g'], money: ['.g.', 'ggg', 'ggg'], pastel: ['.y.', 'yyy'], box: ['RRR', 'RRR', 'RRR'], tank: ['aa', 'aa', 'aa'],
  board: ['w', 'R', 'w', 'R', 'w', 'w'], rose: ['R', 'g', 'g'], spit: ['a', 'r', 'r', 'a'], bills: ['ggg', 'ggg'], hats: ['www', 'www'],
  flag: ['RR', 'a.', 'a.', 'a.'], clip: ['ww', 'ww', 'aa'], buoy: ['RwR', 'w.w', 'RwR'], cup: ['w', 'n'], bags: ['nnn', 'kkk', 'nnn', 'kkk'],
  balloon: ['R', 'R', 'a', 'a'], ticket: ['yy', 'yy'], shop: ['M.M', 'MMM', 'MMM'], papers: ['ww', 'ww', 'ww'], pita: ['nn', 'yy'],
  staff: ['n', 'n', 'n', 'n', 'n', 'n'], passport: ['rr', 'ry'], shield: ['yRy', 'RRR', '.R.'], spear: ['a', 'a', 'n', 'n', 'n', 'n'],
  bell: ['y', 'y'], guitar: ['.n', '.n', 'nn', 'nn'], nata: ['.n.', 'nyn'], calc: ['aa', 'kk', 'aa'], wine: ['.g', 'gg', 'gg'],
};
const ACC = ['taxi', 'tray', 'folder', 'choc', 'sign', 'phone', 'roll', 'bino',
  'case', 'radio', 'corn', 'money', 'pastel', 'box', 'tank', 'folder', 'board', 'rose', 'spit', 'bills',
  'hats', 'flag', 'clip', 'buoy', 'cup', 'bags', 'balloon', 'ticket', 'shop', 'case', 'radio', 'papers',
  'flag', 'pita', 'staff', 'passport', 'shield', 'spear', 'bell', 'guitar', 'nata', 'calc', 'staff', 'wine'];
// 01: boné verde-amarelo, óculos escuros, terno escuro e gravata verde
const FLAVIO = patch(person('y', 'd', 'd', 'p', 'cap'), { 2: [[12, 'GGGG']], 5: [[3, 'kkkkkkkkkk']], 12: [[6, 'wggw']],
  13: [[7, 'gg']], 14: [[7, 'gg']], 15: [[7, 'gg']], 16: [[7, 'gg']] });
// agente: boné e farda azuis com faixa amarela, coturno marrom
const AGENT = patch(person('b', 'b', 'k', 'p', 'cap'), { 2: [[12, 'kkkk']], 14: [[3, 'yyyyyyyyyy']], 24: [[3, 'nnnn'], [9, 'nnnn']], 25: [[2, 'nnnnn'], [9, 'nnnnn']] });
const FEET = 88;

// --- alta resolução: pixel de 1 unidade, ainda nas 16 cores; meio-tom por pontilhado xadrez ---
// os <defs> vão dentro da cena, para o cartão de compartilhar (que serializa só o #art) levar junto
const DITHER = '<defs>' + Object.entries(K).map(([k, c]) =>
  `<pattern id="d-${k}" width="2" height="2" patternUnits="userSpaceOnUse">${R(0, 0, 1, 1, c)}${R(1, 1, 1, 1, c)}</pattern>`).join('') + '</defs>';
const dith = (x, y, w, h, c1, c2) => R(x, y, w, h, K[c1]) + R(x, y, w, h, `url(#d-${c2})`);
// degradê vertical (céu, mar) de top a bottom: pontilhado ordenado (Bayer 4x4), 8 níveis entre cada par de cores
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const grad = (top, bottom, ...cs) => {
  const n = (cs.length - 1) * 8, y = j => top + Math.round(j * (bottom - top) / (n + 1));
  let defs = '', out = R(0, top, 160, bottom - top, K[cs.at(-1)]);
  for (let j = 0; j < n; j++) {
    const lvl = j % 8 * 2, next = K[cs[(j >> 3) + 1]], id = `g${top}-${j}`, band = f => R(0, y(j), 160, y(j + 1) - y(j), f);
    if (lvl) defs += `<pattern id="${id}" width="4" height="4" patternUnits="userSpaceOnUse">${BAYER.map((b, i) => b < lvl ? R(i % 4, i >> 2, 1, 1, next) : '').join('')}</pattern>`;
    out += band(K[cs[j >> 3]]) + (lvl ? band(`url(#${id})`) : '');
  }
  return `<defs>${defs}</defs>` + out;
};
// forma desenhada linha a linha: meia-largura f(t), t de 0 (topo) a 1 (base); lado esquerdo iluminado
const shape = (cx, top, bottom, f, lit, shade = lit) => Array.from({ length: bottom - top }, (_, j) => {
  const h = Math.round(f((j + 1) / (bottom - top)));
  return h > 0 ? R(cx - h, top + j, h, 1, K[lit] ?? lit) + R(cx, top + j, h, 1, K[shade] ?? shade) : '';
}).join('');
// mesma forma com o lado direito em meio-tom, para sombra suave
const shaded = (cx, top, bottom, f, lit, dark) => shape(cx, top, bottom, f, lit) + shape(cx, top, bottom, f, 'none', `url(#d-${dark})`);
const round = t => Math.sqrt(t * (2 - t)); // perfil de cúpula
const disc = (cx, cy, r, c) => shape(cx, cy - r, cy, t => r * round(t), c) + shape(cx, cy, cy + r, t => r * round(1 - t + 1 / r), c);
const line = (x1, y1, x2, y2, c) => {
  const n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1));
  return Array.from({ length: n + 1 }, (_, i) => R(Math.round(x1 + (x2 - x1) * i / n), Math.round(y1 + (y2 - y1) * i / n), 1, 1, K[c])).join('');
};
const BIRD = ['k...k', '.k.k.', '..k..'];
const birds = (y, dur) => `<g class="cloud" style="animation-duration:${dur}s">${spr(BIRD, 0, y, '', 1)}${spr(BIRD, 8, y + 4, '', 1)}</g>`;
const CRISTO = ['.......w.......', '......www......', '......wwa......', 'wwwwwwwwwwwwwwa', 'aaaaawwwaaaaaa.', '......wwa......',
  '......wwa......', '.....wwwa......', '.....wwwa......', '.....wwwaa.....', '.....wwwaa.....', '....wwwwaa.....', '....wwwwaa.....',
  '...wwwwwaaa....', '....aaaaaaa....', '....ddddddd....', '....aaaaaaa....', '....ddddddd....'];
const ministry = x => R(x, 57, 7, 7, K.gry) + [58, 60, 62].map(y => R(x + 1, y, 5, 1, K.dgr)).join('');
const CALCADA = [80, 85].map(y => Array.from({ length: 160 }, (_, x) => R(x, y + Math.round(2 * Math.sin(x / 4)), 1, 1, K.gry)).join('')).join('');

// prédio com janelas em grade e lado direito na sombra
const tower = (x, top, bottom, w, c, wc, sh) => R(x, top, w, bottom - top, K[c]) + R(x + w - 1, top, 1, bottom - top, K[sh]) +
  Array.from({ length: Math.floor((bottom - top - 2) / 3) }, (_, j) => Array.from({ length: Math.floor((w - 1) / 2) }, (_, i) =>
    R(x + 1 + i * 2, top + 2 + j * 3, 1, 1, K[wc])).join('')).join('');
const arch = (x, y, w, h, c) => R(x, y + 1, w, h - 1, K[c]) + R(x + 1, y, w - 2, 1, K[c]);
const palm = (x, bottom, h, trunk = 'brn', leaf = 'grn', leaf2 = 'lgn') => {
  const tx = x + 4, ty = bottom - h;
  return Array.from({ length: h }, (_, j) => R(x + Math.round(3 * (j / h) ** 2), bottom - j - 1, 2, 1, K[trunk])).join('') +
    [[-10, 4], [-7, 7], [-4, -3], [4, -3], [7, 7], [10, 4], [0, -4]].map(([dx, dy]) =>
      line(tx, ty, tx + dx, ty + dy, leaf2) + line(tx, ty + 1, tx + dx, ty + dy + 1, leaf)).join('');
};
const crown = (x, bottom, r, c, hi, trunk = 'brn') => R(x - 1, bottom - r - 2, 2, r + 2, K[trunk]) + disc(x, bottom - r - 3, r, c) + disc(x - r / 3, bottom - r - 4 - r / 3, r / 2, hi);
const cypress = (x, bottom, h) => R(x - 1, bottom - 2, 2, 2, K.brn) + shape(x, bottom - h, bottom - 2, t => .5 + 3 * Math.sin(Math.PI * Math.min(1, t * 1.15) * .85), 'grn', 'dgr');
const burst = (x, y, r, c) => R(x, y, 1, 1, K.wht) + Array.from({ length: 8 }, (_, k) => [r, r * .55].map(d =>
  R(x + Math.round(d * Math.cos(k * Math.PI / 4)), y + Math.round(d * Math.sin(k * Math.PI / 4)), 1, 1, K[c])).join('')).join('');
const ferris = (cx, cy, r) => {
  const pts = Array.from({ length: 8 }, (_, k) => [cx + Math.round(r * Math.cos(k * Math.PI / 4)), cy + Math.round(r * Math.sin(k * Math.PI / 4))]);
  const spokes = odd => pts.filter((_, k) => k % 2 === odd).map(([x, y]) => line(cx, cy, x, y, 'gry')).join('');
  return line(cx, cy, cx - 9, 66, 'gry') + line(cx, cy, cx + 9, 66, 'gry') +
    Array.from({ length: 72 }, (_, k) => R(cx + Math.round(r * Math.cos(k * Math.PI / 36)), cy + Math.round(r * Math.sin(k * Math.PI / 36)), 1, 1, K.wht)).join('') +
    anim('blink', spokes(0)) + anim('blink2', spokes(1)) + pts.map(([x, y], k) => R(x - 1, y, 3, 3, K[['lrd', 'yel', 'lcy', 'lgn'][k % 4]])).join('');
};
const coaster = (x0, x1) => Array.from({ length: x1 - x0 }, (_, i) => {
  const y = Math.round(42 - 12 * Math.cos(i / 6) - 4 * Math.sin(i / 2.5));
  return R(x0 + i, y, 1, 2, K.lrd) + (i % 5 ? '' : R(x0 + i, y + 2, 1, 66 - y - 2, K.gry));
}).join('');
// coliseu: 3 andares de arcos e ático, ruína em degraus à direita, sombra pontilhada

  const x = 36 + i, top = x < 98 ? 26 : 26 + 4 * Math.floor((x - 96) / 4), m = (x - 38) % 6;

const mx = lon => (lon + 100) * 160 / 150, my = lat => (55 - lat) * 90 / 110;
const xy = c => [mx(CITY_LL[c][0]), my(CITY_LL[c][1])];
const map = () => R(0, 0, 160, 90, K.blu) +
  [20, 40, 60, 80, 100, 120, 140].map(x => R(x, 0, .3, 90, K.lbl)).join('') + [15, 30, 45, 60, 75].map(y => R(0, y, 160, .3, K.lbl)).join('') +
  LAND.map(a => P(a.map((v, i) => i % 2 ? my(v) : mx(v)).join(' '), K.grn)).join('');
// lado do rótulo por cidade (direita, esquerda, acima, abaixo) para não encavalar vizinhas
const SIDE = 'rlrrrdurlrul';
const LBL = { r: [2.5, 1.5, 'start'], l: [-2.5, 1.5, 'end'], u: [0, -2.5, 'middle'], d: [0, 5.5, 'middle'] };
const dot = (c, color, label = '', a = '') => {
  const [x, y] = xy(c), [dx, dy, anchor] = LBL[SIDE[c]];
  return C(x, y, 1.6, color, a) + (label ? T(x + dx, y + dy, 4, K.wht, label, `text-anchor="${anchor}"`) : '');
};
const PLANE = `<polygon points="5,0 1,1 -1,4 -2.5,4 -1.5,1 -3.5,1 -4.5,2.5 -5.5,2.5 -4.5,0 -5.5,-2.5 -4.5,-2.5 -3.5,-1 -1.5,-1 -2.5,-4 -1,-4 1,-1" fill="${K.wht}" stroke="${K.blk}" stroke-width=".3"/>`;

// --- som: bipes de PC speaker (onda quadrada) ---
let ac, muted = localStorage.mute === '1';
const snd = document.getElementById('snd');
const toggleSound = () => { muted = !muted; localStorage.mute = muted ? '1' : '0'; snd.textContent = muted ? '🔇' : '🔊'; };
snd.textContent = muted ? '🔇' : '🔊';
snd.onclick = toggleSound;
function beep(f, ms, f2 = f, at = 0, vol = .03) {
  if (muted) return;
  ac ??= new AudioContext();
  if (ac.state === 'suspended') ac.resume();
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at / 1000;
  o.type = 'square';
  o.frequency.setValueAtTime(f, t);
  o.frequency.linearRampToValueAtTime(f2, t + ms / 1000);
  g.gain.value = vol;
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + ms / 1000);
}
const siren = () => { for (let i = 0; i < 8; i++) beep(i % 2 ? 660 : 880, 220, undefined, i * 230); };

const art = document.getElementById('art');
function draw(kind, a) {
  if (kind === 'title') {
    art.innerHTML = map() + CITY_LL.map((_, c) => dot(c, K.yel)).join('') + `<g id="plane">${PLANE}</g>` +
      R(14, 30, 132, 22, K.blk, 'opacity=".7"') + T(80, 47, 15, K.yel, 'CADÊ O 01?', 'text-anchor="middle" font-weight="bold"') +
      anim('bob', at(FLAVIO, 140, FEET, '', 1)) + anim('bob', at(AGENT, 4, FEET, '', 1));
    titleLoop();
  } else if (kind === 'dossie' || kind === 'lose' && a[2]) {
    // dossiê com carimbo; no arquivamento o carimbo é ARQUIVADO e o 01 foge ao fundo
    const stamp = kind === 'dossie' ? 'CONFIDENCIAL' : 'ARQUIVADO';
    art.innerHTML = R(0, 0, 160, 90, K.dgr) + R(30, 12, 40, 8, K.brn) + R(30, 18, 100, 64, K.brn) + R(34, 22, 92, 56, K.yel) +
      [30, 36, 42, 48, 54, 60, 66].map(y => R(40, y, 70 - (y % 12) * 2, 2, K.dgr)).join('') +
      // no arquivamento o carimbo desce para o balão da fala não cobrir
      `<g transform="translate(0 ${kind === 'lose' ? 18 : 0}) rotate(-12 80 50)">${R(46, 40, 70, 16, 'none', `stroke="${K.red}" stroke-width="2"`)}${T(81, 52, 9, K.red, stamp, 'text-anchor="middle" font-weight="bold"')}</g>` +
      (kind === 'lose' ? anim('away', spr(JET, 4, 70)) : '');
  } else if (kind === 'brief') {
    art.innerHTML = CITY[a[0]]() + at(AGENT, 72, FEET, '', 1);
  } else if (kind === 'city') {
    // a = [cidade, w0, w1, w2, fala, no_rastro, horas, prazo]
    const left = a[6] / a[7], bar = left > .5 ? K.lgn : left > .25 ? K.yel : K.lrd;
    art.innerHTML = CITY[a[0]]() +
      (a[5] && !a[4] ? anim('run', at(FLAVIO.map(r => r.replace(/[^.]/g, 'k')), 0, 70, 'opacity=".8"', 1)) : '') +
      witnesses(a.slice(1, 4), a[4]) + R(2, 2, 52, 5, K.blk, `stroke="${K.gry}" stroke-width=".5"`) + R(3, 3, 50 * left, 3, bar, left <= .25 ? 'class="blink"' : '') +
      // selo enquanto o mandado vale; some sozinho se cair num habeas corpus
      (a[8] ? R(57, 1, 44, 9, K.yel, `stroke="${K.blk}" stroke-width=".8"`) + T(79, 8.4, 9, K.blk, '⚖ MANDADO', 'text-anchor="middle" font-weight="bold"') : '');
  } else if (kind === 'travel') {
    art.innerHTML = map() + C(...xy(a[0]), 3, 'none', `stroke="${K.lrd}" stroke-width=".6" class="blink"`) + dot(a[0], K.lrd) + T(xy(a[0])[0] + 4, xy(a[0])[1] + 1.5, 4, K.lrd, 'você') + a.slice(1).map((c, i) => dot(c, K.yel, `${i + 1}.${CITY_NAME[c]}`)).join('');
  } else if (kind === 'win') {
    art.innerHTML = CITY[a[0]]() + R(0, 0, 160, 90, K.blk, 'opacity=".35"') +
      `<g class="blink">${R(0, 0, 80, 6, K.red)}${R(80, 0, 80, 6, K.lbl)}</g><g class="blink2">${R(0, 0, 80, 6, K.lbl)}${R(80, 0, 80, 6, K.red)}</g>` +
      R(40, 10, 80, 18, K.blk) + T(80, 23, 11, K.lgn, 'PEGO!', 'text-anchor="middle" font-weight="bold"') +
      // faixa embaixo, fora do caminho do balão
      R(104, 79, 54, 9, K.yel, `stroke="${K.blk}" stroke-width=".8"`) + T(131, 86, 7, K.blk, '⚖ MANDADO DO STF', 'text-anchor="middle" font-weight="bold"') +
      at(AGENT, 60, FEET, '', 1) + spr(WARRANT, 52, FEET - 16, '', 1) + at(FLAVIO, 84, FEET, '', 1) + R(76, FEET - 10, 8, 2, K.gry) + anim('bob', spr(['.wwwww.', 'wRwRwRw', '.wwwww.', '...w...'], 98, 50));
  } else if (kind === 'lose') {
    art.innerHTML = CITY[a[0]]() + at(AGENT, 30, FEET, '', 1) + anim('away', spr(JET, 70, 40));
  }
}

// cartão 1080×1920 com a cena de fim (sem animação CSS) e o resultado; o link vai escrito porque o Instagram descarta o texto
async function card(share) {
  const [line, url] = share.split(' Cadê o 01? ');
  const img = new Image();
  img.src = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(art).replace('<svg', '<svg shape-rendering="crispEdges"')], {type: 'image/svg+xml'}));
  await img.decode();
  URL.revokeObjectURL(img.src);
  await document.fonts.load('72px VT323'); // o canvas não espera a fonte sozinho
  const c = document.createElement('canvas'), g = c.getContext('2d');
  c.width = 1080; c.height = 1920;
  g.fillStyle = '#000'; g.fillRect(0, 0, 1080, 1920);
  g.textAlign = 'center';
  g.fillStyle = '#ffff55'; g.font = '150px VT323, monospace';
  g.fillText('CADÊ O 01?', 540, 400);
  g.drawImage(img, 0, 520, 1080, 608);
  g.font = '72px VT323, monospace';
  let y = 1280, row = '';
  for (const word of line.split(' ')) {
    if (row && g.measureText(row + ' ' + word).width > 960) { g.fillText(row, 540, y); y += 80; row = word; }
    else row = row ? row + ' ' + word : word;
  }
  g.fillText(row, 540, y);
  g.fillStyle = '#55ffff'; g.font = '56px VT323, monospace';
  g.fillText(url.replace('https://', ''), 540, 1780);
  return new Promise(r => c.toBlob(r, 'image/png'));
}

// descrição em texto de cada cena, para leitor de tela
function describe(kind, a) {
  const c = CITY_NAME[a[0]];
  return kind === 'title' ? 'Mapa-múndi com as cidades do jogo; o agente e o 01 nos cantos.'
    : kind === 'dossie' ? 'Pasta de dossiê com carimbo CONFIDENCIAL.'
    : kind === 'brief' ? `Cartão-postal de ${c}, com o agente no centro.`
    : kind === 'city' ? `Cartão-postal de ${c}, com três testemunhas${a[4] ? '; uma delas está falando' : ''}${a[5] && !a[4] ? '; uma silhueta passa correndo ao fundo' : ''}${a[8] ? '; selo: mandado em mãos' : ''}.`
    : kind === 'travel' ? `Mapa com a sua posição em ${c} e os destinos numerados: ${a.slice(1).map(d => CITY_NAME[d]).join(', ')}.`
    : kind === 'win' ? `Em ${c}, o agente, com o mandado do STF na mão, algema o 01 sob luzes de sirene.`
    : a[2] ? 'Dossiê com carimbo ARQUIVADO; o jatinho do 01 vai embora.'
    : `Em ${c}, o 01 foge de jatinho enquanto o agente olha.`;
}

// avião voando por uma curva entre duas cidades
function fly(from, to, ms, done) {
  const [x1, y1] = xy(from), [x2, y2] = xy(to);
  const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - Math.hypot(x2 - x1, y2 - y1) * .3;
  const path = art.querySelector('#trail') ?? art.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'));
  path.id = 'trail';
  path.setAttribute('d', `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`);
  path.setAttribute('fill', 'none'); path.setAttribute('stroke', K.wht); path.setAttribute('stroke-dasharray', '1.5 1.5'); path.setAttribute('stroke-width', '.5');
  const plane = art.querySelector('#plane') ?? (art.insertAdjacentHTML('beforeend', `<g id="plane">${PLANE}</g>`), art.querySelector('#plane'));
  const t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - t0) / ms), u = 1 - t;
    const x = u * u * x1 + 2 * u * t * cx + t * t * x2, y = u * u * y1 + 2 * u * t * cy + t * t * y2;
    const ang = Math.atan2(2 * u * (cy - y1) + 2 * t * (y2 - cy), 2 * u * (cx - x1) + 2 * t * (x2 - cx)) * 180 / Math.PI;
    plane.setAttribute('transform', `translate(${x} ${y}) rotate(${ang}) scale(1.2)`);
    if (t < 1 && plane.isConnected) requestAnimationFrame(step); else if (done) done();
  })(t0);
}

let titleRun = 0;
function titleLoop(from = 0) {
  const run = ++titleRun, to = (from + 1 + Math.floor(Math.random() * 11)) % 12;
  fly(from, to, 2200, () => { if (run === titleRun && scene0 === 'title') titleLoop(to); });
}

// --- ponte com o wasm ---
const { instance } = await WebAssembly.instantiateStreaming(fetch('game.wasm'));
const w = instance.exports;
const dec = new TextDecoder('utf-8');
const text = document.getElementById('text'), opts = document.getElementById('opts'), sr = document.getElementById('sr');
let scene0 = '', city0 = -1, busy = false;

// texto aparece aos poucos; bipe de digitação só na fala da testemunha
function type(el, s, talk) {
  clearInterval(el.typing);
  let n = 0;
  el.typing = setInterval(() => { n += 3; if (talk && n % 12 === 0 && s[n] > ' ') beep(1200 + n % 5 * 60, 6); el.textContent = s.slice(0, n); if (n >= s.length) clearInterval(el.typing); }, 12);
  el.onclick = () => { clearInterval(el.typing); el.textContent = s; };
}
const balloon = document.getElementById('balloon'), say = balloon.querySelector('#say'), tail = document.getElementById('tail'), news = document.getElementById('news');
// fala no balão; x em % da cena, sobre a cabeça de quem falou
function talk(s, x) {
  balloon.hidden = false;
  tail.style.left = x + '%';
  say.style.left = x < 50 ? '2%' : '';
  say.style.right = x < 50 ? '' : '2%';
  type(say.firstChild, s, true);
}
// prova (+) sobe o arpejo; evento ruim (-) desce
function headline(lines) {
  news.replaceChildren(...lines.map(l => Object.assign(document.createElement('div'), { className: l[0] === '+' ? 'hl' : 'hl bad', textContent: l.slice(2) })));
  const notes = lines.some(l => l[0] === '-') ? [392, 330, 262] : lines.length ? [523, 659, 784] : [];
  notes.forEach((f, i) => beep(f, 120, f, i * 110));
}

function choose(i) {
  if (busy) return;
  w.act(i);
  show();
}

let lastScene;
function show() {
  const lines = dec.decode(new Uint8Array(w.memory.buffer, w.out_ptr(), w.out_len())).split('\n');
  const [kind, ...args] = lines[0].slice(1).split(' ');
  const a = args.map(Number);
  const body = lines.slice(1).filter(l => !/^[>#~"+-] /.test(l)).join('\n').trim();
  // fala da testemunha e notícias (provas/eventos) saem do texto corrido
  const speech = lines.find(l => l.startsWith('" '))?.slice(2), hl = lines.filter(l => /^[+-] /.test(l));
  if (kind === 'city' && !speech) a[4] = 0; // depois do mandado ninguém está falando
  balloon.hidden = true;
  news.replaceChildren();
  const share = lines.find(l => l.startsWith('# '))?.slice(2);
  const buttons = lines.filter(l => l.startsWith('> ')).map((l, i) => {
    const b = document.createElement('button');
    b.textContent = `${i + 1}. ${l.slice(2)}`;
    b.onclick = () => choose(i);
    return b;
  });
  // fontes do dossiê viram links para as reportagens
  for (const [label, url] of lines.filter(l => l.startsWith('~ ')).map(l => l.slice(2).split('|'))) {
    const l = document.createElement('a');
    l.href = url; l.target = '_blank'; l.rel = 'noopener';
    l.textContent = `${buttons.length + 1}. 🔗 ${label}`;
    buttons.push(l);
  }
  // imagem 9:16 para Stories/Status; gerada antes do clique porque o Safari exige share() logo após o toque
  if (share && navigator.canShare?.({files: [new File([''], 'x.png', {type: 'image/png'})]})) {
    const b = document.createElement('button');
    b.textContent = `${buttons.length + 1}. 📲 Compartilhar imagem`;
    b.disabled = true;
    let file;
    b.onclick = () => navigator.share({files: [file], text: share}).catch(() => {});
    b.prep = () => card(share).then(blob => { file = new File([blob], 'cade-o-01.png', {type: 'image/png'}); b.disabled = false; });
    buttons.push(b);
  }
  if (share) {
    const b = document.createElement('button'), label = `${buttons.length + 1}. Copiar resultado`;
    b.textContent = label;
    b.onclick = () => navigator.clipboard.writeText(share).then(() => {
      b.textContent = '✔ Copiado!';
      setTimeout(() => b.textContent = label, 2000);
    }, () => prompt('Copie o resultado:', share));
    buttons.push(b);
  }
  const finish = () => {
    busy = false;
    opts.replaceChildren(...buttons);
    quit.hidden = !['brief', 'city', 'travel'].includes(kind);
    draw(kind, a);
    // troca de cena (não a cada fala) entra com um fade em degraus, estilo paleta de DOS
    if (kind + a[0] !== lastScene && !matchMedia('(prefers-reduced-motion: reduce)').matches) art.animate({ opacity: [0, 1] }, { duration: 320, easing: 'steps(4)' });
    lastScene = kind + a[0];
    buttons.forEach(b => b.prep?.());
    art.setAttribute('aria-label', describe(kind, a));
    sr.textContent = [body, speech, ...hl.map(l => l.slice(2))].filter(Boolean).join('\n');
    type(text, body);
    // cidade: testemunha de 16 unidades em WX, numa cena de 160; fim: o 01 (vitória), o jatinho ou o carimbo
    if (speech) talk(speech, kind === 'city' ? (WX[a[4] - 1] + 8) / 1.6 : kind === 'win' ? 57 : a[2] ? 8 : 48);
    headline(hl);
    if (kind === 'win') siren();
    if (kind === 'win' || kind === 'lose') try { localStorage.solved = a[1]; } catch {}
    if (kind === 'lose') beep(440, 900, 110);
  };
  const flying = scene0 === 'travel' && kind !== 'travel' && a[0] !== city0;
  if (flying) {
    busy = true;
    opts.replaceChildren();
    text.textContent = '✈️ Voando...';
    beep(180, 1500, 900, 0, .02);
    fly(city0, a[0], 1600, finish);
  } else finish();
  if (kind !== 'title') titleRun++;
  scene0 = kind;
  if (kind !== 'title' && kind !== 'dossie') city0 = a[0];
}

const quit = document.getElementById('quit');
quit.onclick = () => { if (!busy && confirm('Abandonar o caso? Ele não conta como vitória nem derrota.')) { w.abandon(); show(); } };
addEventListener('keydown', e => { if (e.key === 's' || e.key === 'S') return toggleSound(); opts.children[+e.key - 1]?.click(); });
// carreira: total de casos resolvidos; valor ausente ou inválido vale 0
let solved = 0;
try { const v = Number(localStorage.solved ?? 0); if (Number.isInteger(v) && v >= 0 && v <= 0xFFFFFFFF) solved = v; } catch {}
w.start(Date.now() >>> 0, solved);
show();
</script>
</body>
