<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadê o 01?</title>
<style>
  body { background: #000; color: #ffff55; font: 18px/1.5 "Courier New", monospace; max-width: 760px; margin: .8em auto; padding: 0 1em; }
  #art { display: block; box-sizing: border-box; width: 100%; aspect-ratio: 16 / 9; border: 4px solid #aaaaaa; border-bottom: 0; background: #0000aa; shape-rendering: crispEdges; }
  #text { white-space: pre-wrap; border: 4px solid #aaaaaa; padding: 1em; background: #0000aa; min-height: 6em; cursor: pointer; }
  #opts { display: grid; grid-template-columns: 1fr 1fr; gap: .4em; margin-top: .4em; }
  @media (max-width: 600px) { body { font-size: 16px; } #opts { grid-template-columns: 1fr; } }
  #opts button { display: block; width: 100%; padding: .4em .5em; text-align: left; font: inherit; font-size: 15px; color: #000; background: #55ffff; border: 0; cursor: pointer; }
  #opts button:hover, #opts button:focus { background: #fff; }
  #opts button:disabled { opacity: .4; }
  .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(200px); } }
  .rain { animation: fall .5s linear infinite; }
  @keyframes fall { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
  .spin { transform-box: fill-box; transform-origin: center; animation: spin 8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blink { animation: blink .6s steps(1) infinite; }
  .blink2 { animation: blink .6s steps(1) infinite -.3s; }
  @keyframes blink { 50% { opacity: 0; } }
  .bob { animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(1.5px); } }
  .run { animation: run 3s linear forwards; }
  @keyframes run { from { transform: translateX(170px); } to { transform: translateX(-30px); } }
  #snd { position: fixed; top: .5em; right: .5em; font-size: 20px; background: none; border: 0; cursor: pointer; }
  .away { animation: away 3s ease-in forwards; }
  @keyframes away { from { transform: translate(0, 0); } to { transform: translate(140px, -70px) scale(.3); } }
</style>
</head>
<body>
<button id="snd" title="Som (tecla S)" aria-label="Ligar ou desligar o som">🔊</button>
<svg id="art" viewBox="0 0 160 90"></svg>
<div id="text">Carregando…</div>
<div id="opts"></div>
<script type="module">
// --- arte: tudo desenhado aqui, paleta de 16 cores estilo EGA ---
const K = { blk: '#000', blu: '#0000aa', grn: '#00aa00', cya: '#00aaaa', red: '#aa0000', mag: '#aa00aa', brn: '#aa5500', gry: '#aaaaaa',
  dgr: '#555555', lbl: '#5555ff', lgn: '#55ff55', lcy: '#55ffff', lrd: '#ff5555', lmg: '#ff55ff', yel: '#ffff55', wht: '#fff' };
const R = (x, y, w, h, c, a = '') => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" ${a}/>`;
const P = (pts, c, a = '') => `<polygon points="${pts}" fill="${c}" ${a}/>`;
const C = (x, y, r, c, a = '') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" ${a}/>`;
const D = (d, c, a = '') => `<path d="${d}" fill="${c}" ${a}/>`;
const T = (x, y, s, c, txt, a = '') => `<text x="${x}" y="${y}" font-size="${s}" fill="${c}" font-family="monospace" ${a}>${txt}</text>`;
// sprites: grade de texto, 1 letra = 1 pixel de 2x2 unidades; '.' é transparente
const PAL = { k: K.blk, b: K.blu, g: K.grn, c: K.cya, r: K.red, m: K.mag, n: K.brn, a: K.gry, d: K.dgr, B: K.lbl,
  G: K.lgn, C: K.lcy, R: K.lrd, M: K.lmg, y: K.yel, w: K.wht, p: '#ffaa77' };
const spr = (rows, x, y, a = '') => {
  let out = '';
  rows.forEach((row, j) => {
    for (let i = 0; i < row.length;) {
      let n = 1;
      while (row[i + n] === row[i]) n++;
      if (row[i] !== '.') out += R(i * 2, j * 2, n * 2, 2, PAL[row[i]]);
      i += n;
    }
  });
  return `<g transform="translate(${x} ${y})" ${a}>${out}</g>`;
};
const at = (rows, x, bottom, a) => spr(rows, x, bottom - rows.length * 2, a); // apoia o sprite no chão
const anim = (cls, s) => `<g class="${cls}">${s}</g>`; // animação CSS fora do transform do sprite

// geradores de grade
const fill = (w, h, c) => Array(h).fill(c.repeat(w));
const tri = (w, h, c) => Array.from({ length: h }, (_, r) => {
  const k = Math.max(1, Math.round((r + 1) / h * w / 2)), pad = '.'.repeat(w / 2 - k);
  return pad + c.repeat(2 * k) + pad;
});
const building = (w, h, c, win = 'y') => Array.from({ length: h }, (_, r) =>
  r % 2 && r < h - 1 ? [...Array(w)].map((_, i) => i % 2 && i < w - 1 ? win : c).join('') : c.repeat(w));
const brick = (w, h) => Array.from({ length: h }, (_, r) =>
  r % 3 === 2 ? 'd'.repeat(w) : [...Array(w)].map((_, i) => (i + (r % 6 < 3 ? 0 : 3)) % 6 === 0 ? 'd' : 'a').join(''));
const obel = h => ['.ww.', ...Array(h - 1).fill('wwww')];
const house = c => ['.rrr.', 'rrrrr', c.repeat(5), `${c}k${c}k${c}`, c.repeat(5)];
const coliseu = () => Array.from({ length: 21 }, (_, r) => {
  const k = r % 7;
  const row = [...Array(40)].map((_, i) => k === 0 || k === 6 || k === 1 || i % 4 < 2 ? 'y' : 'n').join('');
  return r < 7 ? row.slice(0, 26 + r * 2) : row; // topo quebrado à direita
});
const coaster = () => {
  const w = 34, h = 18, g = [...Array(h)].map(() => Array(w).fill('.'));
  for (let x = 0; x < w; x++) {
    const y = Math.round(h / 2 - 1 + (h / 2 - 1) * Math.cos(x * Math.PI * 3 / w));
    g[y][x] = 'R';
    if (x % 4 === 0) for (let j = y + 1; j < h; j++) g[j][x] = 'a';
  }
  return g.map(r => r.join(''));
};
const wheel = diag => Array.from({ length: 17 }, (_, y) => [...Array(17)].map((_, x) => {
  const dx = x - 8, dy = y - 8, d = Math.hypot(dx, dy);
  if (Math.abs(d - 7.5) < .6) return (dx === 0 || dy === 0 || Math.abs(dx) === Math.abs(dy) + 0) && (x + y) % 2 ? 'R' : 'w';
  if (d < 7 && (diag ? Math.abs(dx) === Math.abs(dy) : dx === 0 || dy === 0)) return 'a';
  return '.';
}).join(''));

const SUN = ['.yyy.', 'yyyyy', 'yyyyy', 'yyyyy', '.yyy.'];
const CLOUD = ['..www....', '.wwwwww..', 'wwwwwwwww'];
const PALM = ['..G...G..', '.GgG.GgG.', 'GG.GnG.GG', 'G...n...G', '....n....', '....n....', '....n....', '....n....', '....n....', '...nnn...'];
const TREE = ['.GGGG.', 'GGgGGG', 'GGGGgG', '.GGGG.', '..nn..', '..nn..', '..nn..', '..nn..'];
const IGUANA = ['.....GGk', 'GGGGGGG.', '.g..g...'];
const UMBRELLA = ['..RRR..', '.RRwRR.', 'RRwRRwR', '...n...', '...n...', '...n...'];
const CRISTO = ['...ww...', '..wwww..', 'wwwwwwww', '...ww...', '..wwww..', '..wwww..', '..wwww..', '.aaaaaa.'];
const LIGHTHOUSE = ['..yy..', '.rrrr.', '.wwww.', '.rrrr.', '.wwww.', '.rrrr.', '.wwww.', 'rrrrrr'];
const MASP = ['rrrrrrrrrrrrrrrrrrrrrrrrrr', 'rkkkkkkkkkkkkkkkkkkkkkkkkr', 'rkykykykykykykykykykykykkr', 'rkkkkkkkkkkkkkkkkkkkkkkkkr',
  'rkykykykykykykykykykykykkr', 'rrrrrrrrrrrrrrrrrrrrrrrrrr', ...Array(7).fill('r........................r')];
const CONGRESSO = [...Array(7).fill('..............aa.aa...........'), '..............aaaaa...........', ...Array(4).fill('..............aa.aa...........'),
  'wwwwwwwww.....aa.aa....www....', '.wwwwwww......aa.aa...wwwww...', '..wwwww.......aa.aa..wwwwwww..', '...www........aa.aa.wwwwwwwww.',
  'wwwwwwwwwwwwwwwwwwwwwwwwwwwwww', 'wawawawawawawawawawawawawawawa', 'wwwwwwwwwwwwwwwwwwwwwwwwwwwwww'];
const CASA_ROSADA = ['..........MMMM..........', '........MMMMMMMM........', 'MMMMMMMMMMMMMMMMMMMMMMMM', 'MwMMwMMwMMwMMwMMwMMwMMwM',
  'MMMMMMMMMMMMMMMMMMMMMMMM', 'MwMMwMMwMMwMMwMMwMMwMMwM', 'MMMMMMMMMMMMMMMMMMMMMMMM', 'MMMMMMMMMMkkkkMMMMMMMMMM', 'MMMMMMMMMMkkkkMMMMMMMMMM'];
const CAPITOL = ['.............a..............', '.............ww.............', '............wwww............', '...........wwwwww...........',
  '..........wwwwwwww..........', '.........wwwwwwwwww.........', '.........wawawawawa.........', '.........wwwwwwwwww.........',
  'wwwwwwwwwwwwwwwwwwwwwwwwwwww', 'wawawawawawawawawawawawawawa', 'wawawawawawawawawawawawawawa', 'wawawawawawawawawawawawawawa',
  'wwwwwwwwwwwwwwwwwwwwwwwwwwww', 'aaaaaaaaaaaaaaaaaaaaaaaaaaaa'];
const DOME = ['..........aa..........', '..........yy..........', '........yyyyyy........', '......yyyyyyyyyy......', '.....yyyyyyyyyyyy.....',

const TRAM = ['.........k..........', '.........k..........', '.yyyyyyyyyyyyyyyyyy.', 'yyCCyCCyCCyCCyCCyCyy', 'yyCCyCCyCCyCCyCCyCyy',
  'yyyyyyyyyyyyyyyyyyyy', 'rrrrrrrrrrrrrrrrrrrr', 'yyyyyyyyyyyyyyyyyyyy', '..kk............kk..'];
const SHIP = ['......r.........', '......r.........', '.....www........', '....wwwwww......', 'wwwwwwwwwwwwwwww', '.aaaaaaaaaaaaaa.', '..wwwwwwwwwwww..'];
const JET = ['ww...........', 'www..........', 'wwwwwwwwwwww.', 'wCwCwCwCwwwwC', '.wwwwwwwwwww.', '.....ww......', '....ww.......'];
const BUBBLE = ['.wwwww.', 'wkwkwkw', '.wwwww.', '..w....', '.w.....'];

// personagens 8x13
const PERSON = ['..HHHH..', '.HHHHHH.', '..pppp..', '..kppk..', '..pppp..', '.SSSSSS.', 'SSSSSSSS', 'pSSSSSSp', 'pSSSSSSp', '.LLLLLL.', '.LL..LL.', '.LL..LL.', '.kk..kk.'];
// cabeças alternativas (2 primeiras linhas)

// mesma ordem de WITNESSES em src/lib.rs

  person('n', 'b', 'b'), person('w', 'w', 'b', 'p', 'chef'), person('r', 'r', 'k', 'n', 'cap'), // São Paulo
  person('y', 'y', 'w', 'n', 'hat'), person('a', 'w', 'd', 'p', 'bald'), person('y', 'C', 'b', 'n'), // Rio
  person('k', 'R', 'k'), person('w', 'w', 'k', 'p', 'chef'), person('k', 'g', 'd', 'p', 'cap'), // Buenos Aires
  person('w', 'w', 'n', 'n', 'hat'), person('k', 'C', 'n', 'n', 'cap'), person('b', 'b', 'b', 'n', 'cap'), // Guayaquil
  person('y', 'R', 'R', 'p', 'cap'), person('k', 'w', 'k', 'n'), person('n', 'G', 'b', 'p', 'cap'), // Miami
  person('k', 'R', 'y', 'k', 'ears'), person('M', 'M', 'd'), person('n', 'M', 'b'), // Orlando
  person('a', 'k', 'k'), person('b', 'b', 'b', 'n', 'cap'), person('y', 'w', 'd'), // Washington
  person('a', 'w', 'n', 'p', 'hat'), person('k', 'g', 'd', 'n'), person('a', 'n', 'n', 'p', 'chef'), // Jerusalém
  person('k', 'b', 'd'), person('R', 'y', 'n', 'p', 'plume'), person('R', 'y', 'b', 'p', 'plume'), // Roma
  person('k', 'y', 'd', 'p', 'cap'), person('k', 'd', 'k'), person('w', 'w', 'd', 'p', 'chef'), // Lisboa
  person('a', 'd', 'd', 'p', 'bald'), person('n', 'G', 'n', 'p', 'hat'), person('a', 'm', 'n')]; // Funchal
// acessório na mão direita de cada testemunha, mesma ordem de WITNESS
const PROP = {
  taxi: ['kyk', 'yyy'], tray: ['wyw', 'aaa'], folder: ['yy', 'yy'], choc: ['MMM', 'nnn'], sign: ['RRR', 'RwR', '.a.', '.a.', '.a.'],
  phone: ['k', 'C', 'k'], roll: ['kkk', 'kkk', 'kkk', 'a.a'], bino: ['k.k', 'kkk'], case: ['.k.', 'nnn', 'nnn'], radio: ['a', 'k', 'k'],
  corn: ['g', 'y', 'y', 'g'], money: ['.g.', 'ggg', 'ggg'], pastel: ['.y.', 'yyy'], box: ['RRR', 'RRR', 'RRR'], tank: ['aa', 'aa', 'aa'],
  board: ['w', 'R', 'w', 'R', 'w', 'w'], rose: ['R', 'g', 'g'], spit: ['a', 'r', 'r', 'a'], bills: ['ggg', 'ggg'], hats: ['www', 'www'],
  flag: ['RR', 'a.', 'a.', 'a.'], clip: ['ww', 'ww', 'aa'], buoy: ['RwR', 'w.w', 'RwR'], cup: ['w', 'n'], bags: ['nnn', 'kkk', 'nnn', 'kkk'],
  balloon: ['R', 'R', 'a', 'a'], ticket: ['yy', 'yy'], shop: ['M.M', 'MMM', 'MMM'], papers: ['ww', 'ww', 'ww'], pita: ['nn', 'yy'],
  staff: ['n', 'n', 'n', 'n', 'n', 'n'], passport: ['rr', 'ry'], shield: ['yRy', 'RRR', '.R.'], spear: ['a', 'a', 'n', 'n', 'n', 'n'],
  bell: ['y', 'y'], guitar: ['.n', '.n', 'nn', 'nn'], nata: ['.n.', 'nyn'], calc: ['aa', 'kk', 'aa'], wine: ['.g', 'gg', 'gg'],
};
const ACC = ['taxi', 'tray', 'folder', 'choc', 'sign', 'phone', 'roll', 'bino',
  'case', 'radio', 'corn', 'money', 'pastel', 'box', 'tank', 'folder', 'board', 'rose', 'spit', 'bills',
  'hats', 'flag', 'clip', 'buoy', 'cup', 'bags', 'balloon', 'ticket', 'shop', 'case', 'radio', 'papers',
  'flag', 'pita', 'staff', 'passport', 'shield', 'spear', 'bell', 'guitar', 'nata', 'calc', 'staff', 'wine'];
const FLAVIO = ['..yyyy..', '.yyyyyGG', '..pppp..', '..kkkk..', '..pppp..', '.dwwwwd.', 'dddggddd', 'pddggddp', 'pddddddp', '.dddddd.', '.dd..dd.', '.dd..dd.', '.kk..kk.'];
const AGENT = ['..bbbb..', '.bbbbbb.', '..pppp..', '..kppk..', '..pppp..', '.bbbbbb.', 'bbyyyybb', 'pbbbbbbp', 'pbbbbbbp', '.kkkkkk.', '.kk..kk.', '.kk..kk.', '.nn..nn.'];
const FEET = 88;

const cloud = (y, dur, delay) => `<g class="cloud" style="animation-duration:${dur}s;animation-delay:-${delay}s">${spr(CLOUD, 0, y)}</g>`;
const scene = (sky, ground, body, opt = {}) =>
  R(0, 0, 160, 90, sky) + (opt.sun === false ? '' : anim('bob', spr(SUN, 136, 6))) +
  cloud(10, 40, 5) + cloud(20, 55, 30) + R(0, 70, 160, 20, ground) + body;
const waves = anim('bob', R(20, 80, 8, 2, K.lcy) + R(90, 84, 10, 2, K.lcy) + R(130, 78, 6, 2, K.lcy));

const CITY = [
  () => scene(K.lbl, K.grn, R(0, 66, 160, 4, K.lgn) + at(CONGRESSO, 50, 70)),
  () => scene(K.gry, K.dgr, at(building(10, 24, 'd'), 0, 70) + at(building(8, 19, 'k'), 22, 70) + at(building(9, 26, 'd'), 118, 70) +
    at(building(10, 20, 'k'), 140, 70) + at(MASP, 54, 70) +
    anim('rain', [10, 30, 50, 70, 90, 110, 130, 150].map((x, i) => R(x, 8 + (i % 3) * 14, 2, 4, K.lcy)).join('')), { sun: false }),
  () => scene(K.lcy, K.blu, at(tri(36, 24, 'g'), 6, 70) + spr(CRISTO, 34, 6) + at(tri(14, 14, 'g'), 96, 70) + at(tri(20, 20, 'g'), 120, 70) +
    D('M110 42 L140 30', 'none', `stroke="${K.blk}" stroke-width=".5"`) + R(0, 70, 160, 4, K.yel) + waves),
  () => scene(K.lbl, K.dgr, at(obel(26), 72, 70) + R(74, 30, 2, 2, K.dgr) + at(CASA_ROSADA, 106, 70) + at(TREE, 12, 70) + R(0, 70, 160, 2, K.yel)),
  () => scene(K.lcy, K.blu, at(tri(40, 16, 'g'), 88, 70) + at(LIGHTHOUSE, 122, 40) + anim('blink', R(126, 22, 4, 2, K.wht)) +
    spr(house('M'), 100, 52) + spr(house('y'), 144, 52) + R(0, 66, 90, 4, K.gry) + at(PALM, 14, 66) + at(PALM, 56, 66) +
    anim('bob', at(IGUANA, 36, 66))),
  () => scene(K.lcy, K.blu, R(0, 64, 160, 8, K.yel) + at(building(14, 20, 'M', 'C'), 92, 64) + at(fill(4, 3, 'M'), 102, 24) +
    at(PALM, 20, 64) + at(PALM, 140, 64) + at(UMBRELLA, 50, 64) + waves),
  () => scene(K.lbl, K.grn, at(tri(10, 12, 'a'), 36, 70) + anim('blink', spr(wheel(false), 28, 14)) + anim('blink2', spr(wheel(true), 28, 14)) +
    at(coaster(), 88, 70)),
  () => scene(K.lbl, K.grn, at(obel(28), 34, 70) + anim('blink', R(36, 16, 2, 2, K.red)) + at(CAPITOL, 96, 70) + R(0, 70, 160, 2, K.lgn)),
  () => scene(K.lcy, K.brn, at(DOME, 56, 60) + at(brick(80, 7), 0, 70), { sun: false }),
  () => scene(K.lbl, K.brn, at(coliseu(), 40, 70)),
  () => scene(K.lcy, K.gry, R(0, 44, 160, 26, K.lgn) + R(0, 38, 90, 6, K.lgn) +
    [[4, 'w'], [20, 'y'], [36, 'R'], [52, 'w'], [68, 'C']].map(([x, c]) => spr(house(c), x, 28)).join('') +
    [[100, 'y'], [116, 'w'], [132, 'M'], [148, 'C']].map(([x, c]) => spr(house(c), x, 34)).join('') +
    R(0, 68, 160, 2, K.dgr) + anim('bob', at(TRAM, 54, 70))),
  () => scene(K.lbl, K.blu, at(tri(60, 24, 'g'), 20, 70) + at(tri(20, 10, 'G'), 50, 42) +
    [[60, 54], [76, 58], [92, 50], [108, 56], [124, 60]].map(([x, y]) => spr(house('w'), x, y)).join('') + anim('bob', at(SHIP, 90, 84))),
];

// testemunhas na frente da cena; quem acabou de falar ganha balão e boca mexendo
// contorno de meio pixel: silhueta preta deslocada nas 4 direções
const outlined = (rows, x, y) => {
  const sil = rows.map(r => r.replace(/[^.]/g, 'k'));
  return [[-1, 0], [1, 0], [0, -1], [0, 1]].map(([dx, dy]) => spr(sil, x + dx, y + dy)).join('') + spr(rows, x, y);
};
const BUBBLE_L = BUBBLE.map(r => [...r].reverse().join(''));
// nas laterais, para não tapar o ponto turístico do centro
const WX = [2, 26, 140];
const witnesses = (ws, talk) => ws.map((w, i) => {
  const x = WX[i], right = x > 100;
  return outlined(WITNESS[w], x, FEET - 26) + outlined(PROP[ACC[w]], right ? x + 2 - PROP[ACC[w]][0].length * 2 : x + 14, FEET - 12) + (talk === i + 1 ?
    anim('bob', outlined(right ? BUBBLE_L : BUBBLE, right ? x - 14 : x + 14, 52)) + anim('blink', R(x + 6, FEET - 18, 4, 2, K.red)) : '');
}).join('');

// --- mapa: continentes grosseiros em lon/lat (equiretangular) ---
const CITY_LL = [[-47.9, -15.8], [-46.6, -23.5], [-43.2, -22.9], [-58.4, -34.6], [-79.9, -2.2], [-80.2, 25.8],
  [-81.4, 28.5], [-77.0, 38.9], [35.2, 31.8], [12.5, 41.9], [-9.1, 38.7], [-16.9, 32.7]];
const CITY_NAME = ['Brasília', 'São Paulo', 'Rio', 'Buenos Aires', 'Guayaquil', 'Miami', 'Orlando', 'Washington', 'Jerusalém', 'Roma', 'Lisboa', 'Funchal'];
const LAND = [
  [-80, 10, -75, 11, -62, 11, -50, 2, -35, -5, -39, -15, -41, -22, -48, -26, -53, -34, -58, -38, -65, -42, -68, -55, -73, -50, -72, -35, -71, -18, -77, -12, -81, -5, -80, 1],

];
// viewBox do mapa = mesma área 160x90 do cartão postal
const mx = lon => (lon + 100) * 160 / 150, my = lat => (55 - lat) * 90 / 110;
const xy = c => [mx(CITY_LL[c][0]), my(CITY_LL[c][1])];
const map = () => R(0, 0, 160, 90, K.blu) +
  [20, 40, 60, 80, 100, 120, 140].map(x => R(x, 0, .3, 90, K.lbl)).join('') + [15, 30, 45, 60, 75].map(y => R(0, y, 160, .3, K.lbl)).join('') +
  LAND.map(a => P(a.map((v, i) => i % 2 ? my(v) : mx(v)).join(' '), K.grn)).join('');
// lado do rótulo por cidade (direita, esquerda, acima, abaixo) para não encavalar vizinhas
const SIDE = 'rlrrrdurlrul';
const LBL = { r: [2.5, 1.5, 'start'], l: [-2.5, 1.5, 'end'], u: [0, -2.5, 'middle'], d: [0, 5.5, 'middle'] };
const dot = (c, color, label = '', a = '') => {
  const [x, y] = xy(c), [dx, dy, anchor] = LBL[SIDE[c]];
  return C(x, y, 1.6, color, a) + (label ? T(x + dx, y + dy, 4, K.wht, label, `text-anchor="${anchor}"`) : '');
};
const PLANE = `<polygon points="5,0 1,1 -1,4 -2.5,4 -1.5,1 -3.5,1 -4.5,2.5 -5.5,2.5 -4.5,0 -5.5,-2.5 -4.5,-2.5 -3.5,-1 -1.5,-1 -2.5,-4 -1,-4 1,-1" fill="${K.wht}" stroke="${K.blk}" stroke-width=".3"/>`;

// --- som: bipes de PC speaker (onda quadrada) ---
let ac, muted = localStorage.mute === '1';
const snd = document.getElementById('snd');
const toggleSound = () => { muted = !muted; localStorage.mute = muted ? '1' : '0'; snd.textContent = muted ? '🔇' : '🔊'; };
snd.textContent = muted ? '🔇' : '🔊';
snd.onclick = toggleSound;
function beep(f, ms, f2 = f, at = 0, vol = .03) {
  if (muted) return;
  ac ??= new AudioContext();
  if (ac.state === 'suspended') ac.resume();
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + at / 1000;
  o.type = 'square';
  o.frequency.setValueAtTime(f, t);
  o.frequency.linearRampToValueAtTime(f2, t + ms / 1000);
  g.gain.value = vol;
  o.connect(g).connect(ac.destination);
  o.start(t); o.stop(t + ms / 1000);
}
const siren = () => { for (let i = 0; i < 8; i++) beep(i % 2 ? 660 : 880, 220, undefined, i * 230); };

const art = document.getElementById('art');
function draw(kind, a) {
  if (kind === 'title') {
    art.innerHTML = map() + CITY_LL.map((_, c) => dot(c, K.yel)).join('') + `<g id="plane">${PLANE}</g>` +
      R(14, 30, 132, 22, K.blk, 'opacity=".7"') + T(80, 47, 15, K.yel, 'CADÊ O 01?', 'text-anchor="middle" font-weight="bold"') +
      anim('bob', at(FLAVIO, 140, FEET)) + anim('bob', at(AGENT, 4, FEET));
    titleLoop();
  } else if (kind === 'dossie' || kind === 'lose' && a[2]) {
    // dossiê com carimbo; no arquivamento o carimbo é ARQUIVADO e o 01 foge ao fundo
    const stamp = kind === 'dossie' ? 'CONFIDENCIAL' : 'ARQUIVADO';
    art.innerHTML = R(0, 0, 160, 90, K.dgr) + R(30, 12, 40, 8, K.brn) + R(30, 18, 100, 64, K.brn) + R(34, 22, 92, 56, K.yel) +
      [30, 36, 42, 48, 54, 60, 66].map(y => R(40, y, 70 - (y % 12) * 2, 2, K.dgr)).join('') +
      `<g transform="rotate(-12 80 50)">${R(46, 40, 70, 16, 'none', `stroke="${K.red}" stroke-width="2"`)}${T(81, 52, 9, K.red, stamp, 'text-anchor="middle" font-weight="bold"')}</g>` +
      (kind === 'lose' ? anim('away', spr(JET, 4, 70)) : '');
  } else if (kind === 'brief') {
    art.innerHTML = CITY[a[0]]() + at(AGENT, 72, FEET);
  } else if (kind === 'city') {
    // a = [cidade, w0, w1, w2, fala, no_rastro, horas, prazo]
    const left = a[6] / a[7], bar = left > .5 ? K.lgn : left > .25 ? K.yel : K.lrd;
    art.innerHTML = CITY[a[0]]() +
      (a[5] && !a[4] ? anim('run', at(FLAVIO.map(r => r.replace(/[^.]/g, 'k')), 0, 70, 'opacity=".8"')) : '') +
      witnesses(a.slice(1, 4), a[4]) + R(2, 2, 52, 5, K.blk) + R(3, 3, 50 * left, 3, bar, left <= .25 ? 'class="blink"' : '');
  } else if (kind === 'travel') {
    art.innerHTML = map() + C(...xy(a[0]), 3, 'none', `stroke="${K.lrd}" stroke-width=".6" class="blink"`) + dot(a[0], K.lrd) + T(xy(a[0])[0] + 4, xy(a[0])[1] + 1.5, 4, K.lrd, 'você') + a.slice(1).map((c, i) => dot(c, K.yel, `${i + 1}.${CITY_NAME[c]}`)).join('');
  } else if (kind === 'win') {
    art.innerHTML = CITY[a[0]]() + R(0, 0, 160, 90, K.blk, 'opacity=".35"') +
      `<g class="blink">${R(0, 0, 80, 6, K.red)}${R(80, 0, 80, 6, K.lbl)}</g><g class="blink2">${R(0, 0, 80, 6, K.lbl)}${R(80, 0, 80, 6, K.red)}</g>` +
      R(40, 10, 80, 18, K.blk) + T(80, 23, 11, K.lgn, 'PEGO!', 'text-anchor="middle" font-weight="bold"') +
      at(AGENT, 60, FEET) + at(FLAVIO, 84, FEET) + R(76, FEET - 10, 8, 2, K.gry) + anim('bob', spr(['.wwwww.', 'wRwRwRw', '.wwwww.', '...w...'], 98, 50));
  } else if (kind === 'lose') {
    art.innerHTML = CITY[a[0]]() + at(AGENT, 30, FEET) + anim('away', spr(JET, 70, 40)) +
      T(80, 12, 7, K.blk, 'tchau, querido...', 'text-anchor="middle"');
  }
}

// avião voando por uma curva entre duas cidades
function fly(from, to, ms, done) {
  const [x1, y1] = xy(from), [x2, y2] = xy(to);
  const cx = (x1 + x2) / 2, cy = Math.min(y1, y2) - Math.hypot(x2 - x1, y2 - y1) * .3;
  const path = art.querySelector('#trail') ?? art.appendChild(document.createElementNS('http://www.w3.org/2000/svg', 'path'));
  path.id = 'trail';
  path.setAttribute('d', `M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}`);
  path.setAttribute('fill', 'none'); path.setAttribute('stroke', K.wht); path.setAttribute('stroke-dasharray', '1.5 1.5'); path.setAttribute('stroke-width', '.5');
  const plane = art.querySelector('#plane') ?? (art.insertAdjacentHTML('beforeend', `<g id="plane">${PLANE}</g>`), art.querySelector('#plane'));
  const t0 = performance.now();
  (function step(now) {
    const t = Math.min(1, (now - t0) / ms), u = 1 - t;
    const x = u * u * x1 + 2 * u * t * cx + t * t * x2, y = u * u * y1 + 2 * u * t * cy + t * t * y2;
    const ang = Math.atan2(2 * u * (cy - y1) + 2 * t * (y2 - cy), 2 * u * (cx - x1) + 2 * t * (x2 - cx)) * 180 / Math.PI;
    plane.setAttribute('transform', `translate(${x} ${y}) rotate(${ang}) scale(1.2)`);
    if (t < 1 && plane.isConnected) requestAnimationFrame(step); else if (done) done();
  })(t0);
}

let titleRun = 0;
function titleLoop(from = 0) {
  const run = ++titleRun, to = (from + 1 + Math.floor(Math.random() * 11)) % 12;
  fly(from, to, 2200, () => { if (run === titleRun && scene0 === 'title') titleLoop(to); });
}

// --- ponte com o wasm ---
const { instance } = await WebAssembly.instantiateStreaming(fetch('game.wasm'));
const w = instance.exports;
const dec = new TextDecoder('utf-8');
const text = document.getElementById('text'), opts = document.getElementById('opts');
let scene0 = '', city0 = -1, busy = false, typing = 0;

// bipe de digitação só quando uma testemunha fala
function type(s, talk) {
  clearInterval(typing);
  let n = 0;
  typing = setInterval(() => { n += 3; if (talk && n % 12 === 0 && s[n] > ' ') beep(1200 + n % 5 * 60, 6); text.textContent = s.slice(0, n); if (n >= s.length) clearInterval(typing); }, 12);
  text.onclick = () => { clearInterval(typing); text.textContent = s; };
}

function choose(i) {
  if (busy) return;
  w.act(i);
  show();
}

function show() {
  const lines = dec.decode(new Uint8Array(w.memory.buffer, w.out_ptr(), w.out_len())).split('\n');
  const [kind, ...args] = lines[0].slice(1).split(' ');
  const a = args.map(Number);
  const body = lines.slice(1).filter(l => !l.startsWith('> ')).join('\n');
  const buttons = lines.filter(l => l.startsWith('> ')).map((l, i) => {
    const b = document.createElement('button');
    b.textContent = `${i + 1}. ${l.slice(2)}`;
    b.onclick = () => choose(i);
    return b;
  });
  const finish = () => {
    busy = false;
    opts.replaceChildren(...buttons);
    draw(kind, a);
    type(body, kind === 'city' && a[4]);
    if (kind === 'win') siren();
    if (kind === 'win' || kind === 'lose') try { localStorage.solved = a[1]; } catch {}
    if (kind === 'lose') beep(440, 900, 110);
  };
  const flying = scene0 === 'travel' && kind !== 'travel' && a[0] !== city0;
  if (flying) {
    busy = true;
    opts.replaceChildren();
    text.textContent = '✈️ Voando...';
    beep(180, 1500, 900, 0, .02);
    fly(city0, a[0], 1600, finish);
  } else finish();
  if (kind !== 'title') titleRun++;
  scene0 = kind;
  if (kind !== 'title' && kind !== 'dossie') city0 = a[0];
}

addEventListener('keydown', e => { if (e.key === 's' || e.key === 'S') return toggleSound(); const n = +e.key; if (n >= 1 && n <= opts.children.length) choose(n - 1); });
// carreira: total de casos resolvidos; valor ausente ou inválido vale 0
let solved = 0;
try { const v = Number(localStorage.solved ?? 0); if (Number.isInteger(v) && v >= 0 && v <= 0xFFFFFFFF) solved = v; } catch {}
w.start(Date.now() >>> 0, solved);
show();
</script>
